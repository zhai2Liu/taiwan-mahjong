name: Taiwan Mahjong Pages

on:
  # Always report the PR check, including docs-only changes, so a required check cannot remain pending due to path filters.
  # ponytail: use the shared full build for every PR; split checks only if measured PR runtime becomes too slow.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'outputs/taiwan-mahjong/**'
      # Root Markdown, screenshots and simulation reports are maintenance evidence, not site inputs.
      - '!outputs/taiwan-mahjong/*.md'
      - '!outputs/taiwan-mahjong/docs/**'
      - '!outputs/taiwan-mahjong/*.jpg'
      - '!outputs/taiwan-mahjong/*SIMULATION.json'
      - 'outputs/taiwan-mahjong-m0/cases.json'
      - 'outputs/taiwan-mahjong-m0/RULES.md'
      - '.github/workflows/pages.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outputs/taiwan-mahjong
    steps:
      # ponytail: pin direct actions; evaluate a workflow lockfile if full transitive identity is required.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: outputs/taiwan-mahjong/package-lock.json
      - run: npm ci
      - name: Check local documentation links
        run: npm run check:docs
      - name: Typecheck and tests
        run: npm test
      - run: npm run build
      - name: Install browser for regression checks
        run: npx playwright install --with-deps chromium
      - name: Core browser regression
        run: npx playwright test
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: outputs/taiwan-mahjong/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: outputs/taiwan-mahjong/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
