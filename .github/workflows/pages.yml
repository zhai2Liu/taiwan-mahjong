name: Taiwan Mahjong Pages

on:
  # Always report the PR check, including docs-only changes, so a required check cannot remain pending due to path filters.
  # ponytail: use the shared full build for every PR; split checks only if measured PR runtime becomes too slow.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'outputs/taiwan-mahjong/**'
      # Root Markdown, screenshots and simulation reports are maintenance evidence, not site inputs.
      - '!outputs/taiwan-mahjong/*.md'
      - '!outputs/taiwan-mahjong/*.jpg'
      - '!outputs/taiwan-mahjong/*SIMULATION.json'
      - 'outputs/taiwan-mahjong-m0/cases.json'
      - 'outputs/taiwan-mahjong-m0/RULES.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outputs/taiwan-mahjong
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: outputs/taiwan-mahjong/package-lock.json
      - run: npm ci
      - name: Typecheck and tests
        run: npm test
      - run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/taiwan-mahjong/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
